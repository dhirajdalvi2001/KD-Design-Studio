# HTTP server to redirect all traffic to HTTPS
server {
    listen 80;
    server_name kd-studio.in www.kd-studio.in;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server configuration
server {
    listen 443 ssl;
    server_name kd-studio.in www.kd-studio.in;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/kd-studio.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kd-studio.in/privkey.pem;

    # SSL settings (for better security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Main website configuration
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri /index.html;
    }
}
